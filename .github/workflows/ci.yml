name: CI

# Basic build/test pipeline for MediGuard AI, referenced in the project
# synopsis's MLOps layer diagram. Runs backend syntax checks + pytest and
# a frontend typecheck + build on every push/PR to main.
#
# This intentionally does NOT deploy anywhere — it's a correctness gate,
# not a CD pipeline. Wire up a deploy job (Render/Vercel/HF Spaces) once
# you have real deployment credentials to store as repo secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, compile, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check (fails fast on syntax errors)
        run: python -m py_compile $(find . -name "*.py" -not -path "./tests/*")

      - name: Run test suite
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-not-for-production
        run: pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
